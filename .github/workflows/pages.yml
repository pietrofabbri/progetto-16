name: Pubblica su GitHub Pages

# A ogni push su main copia index.html, design/, semaforo/ e slides/ nel branch gh-pages.
# GitHub Pages pubblica il branch gh-pages su https://pietrofabbri.github.io/progetto-16/
# (attivato automaticamente alla creazione del branch, 13/10/2026).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepara il sito
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r design semaforo slides _site/
          if [ -d incontri ]; then cp -r incontri _site/; fi   # slide degli incontri già svolti (D-81)
          touch _site/.nojekyll
      - name: Aggiorna il branch gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Pubblicazione da ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
